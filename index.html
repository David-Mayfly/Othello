<meta charset="utf-8">
<title>Othello Vault Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400;500;600;700&display=swap">
<style>
/* ===== Othello Vault design tokens =====
   Brand: one violet. Neutrals: cool grey with a hint of violet.
   Status: ok / warn / bad (always paired with an icon or label).
   Area hues: used only for area icon tiles and dots — never for status. */
:root{
  --bg:#F7F7FA; --surface:#FFFFFF; --sunk:#F2F2F6; --hover:#F0F0F5; --side:#FBFBFD;
  --line:#E7E6EE; --line-strong:#D5D4DE;
  --fg:#14131C; --muted:#5D5C69; --faint:#8C8B98;
  --brand:#5B45E0; --brand-ink:#4431C4; --brand-soft:#EFEDFE; --brand-line:#CFC8FB; --on-brand:#FFFFFF;
  --ok:#11795A; --ok-soft:#E4F5EE; --warn:#965A00; --warn-soft:#FEF3DB; --warn-line:#F0D08A; --bad:#C2342B; --bad-soft:#FDECEA; --bad-line:#F5C2BD; --bad-ink:#7A1D17;
  --c-credit:#2563EB; --c-tax:#D97706; --c-smsf:#0D9488; --c-insurance:#DB2777; --c-legal:#475569; --c-library:#5B45E0;
  --shadow-sm:0 1px 2px rgba(20,19,28,.06); --shadow:0 1px 2px rgba(20,19,28,.05),0 8px 24px rgba(20,19,28,.08); --shadow-lg:0 20px 50px rgba(20,19,28,.18);
  --r-sm:6px; --r:8px; --r-lg:12px;
  --paper:#FFFFFF; --paper-ink:#16161C; --paper-line:#C9C8D2; --paper-head:#14131C; --paper-fill:#F1EEFF; --paper-flag:#FFF3D6;
  --font:'Mona Sans','Helvetica Neue',Helvetica,Arial,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  /* aliases used by view markup */
  --accent:var(--brand); --accent-ink:var(--brand-ink); --accent-soft:var(--brand-soft); --on-accent:var(--on-brand);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0F14; --surface:#17161E; --sunk:#1D1C26; --hover:#22212C; --side:#131219;
  --line:#2A2935; --line-strong:#3A3946;
  --fg:#F1F0F6; --muted:#A6A5B3; --faint:#7B7A88;
  --brand:#8B78FF; --brand-ink:#C1B6FF; --brand-soft:#262049; --brand-line:#43397E; --on-brand:#0F0F14;
  --ok:#5ED3A2; --ok-soft:#12302A; --warn:#F2C065; --warn-soft:#332810; --warn-line:#6A5322; --bad:#FF8F85; --bad-soft:#3A1816; --bad-line:#6B2A25; --bad-ink:#FFC8C2;
  --c-credit:#6EA0FF; --c-tax:#F5A93B; --c-smsf:#3CC7B8; --c-insurance:#F472B6; --c-legal:#9AA8BC; --c-library:#8B78FF;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 20px 50px rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0F14; --surface:#17161E; --sunk:#1D1C26; --hover:#22212C; --side:#131219;
  --line:#2A2935; --line-strong:#3A3946;
  --fg:#F1F0F6; --muted:#A6A5B3; --faint:#7B7A88;
  --brand:#8B78FF; --brand-ink:#C1B6FF; --brand-soft:#262049; --brand-line:#43397E; --on-brand:#0F0F14;
  --ok:#5ED3A2; --ok-soft:#12302A; --warn:#F2C065; --warn-soft:#332810; --warn-line:#6A5322; --bad:#FF8F85; --bad-soft:#3A1816; --bad-line:#6B2A25; --bad-ink:#FFC8C2;
  --c-credit:#6EA0FF; --c-tax:#F5A93B; --c-smsf:#3CC7B8; --c-insurance:#F472B6; --c-legal:#9AA8BC; --c-library:#8B78FF;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 20px 50px rgba(0,0,0,.55);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ico.lg{width:18px;height:18px}

/* ===== App shell ===== */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.sb{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:12px 10px;gap:16px;z-index:20}
.ws{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r);border:0;background:none;text-align:left;width:100%}
.ws:hover{background:var(--hover)}
.mark{width:30px;height:30px;border-radius:8px;background:var(--fg);color:var(--bg);display:grid;place-items:center;flex:none}
.ws b{display:block;font-size:14px;font-weight:600;line-height:1.2} .ws small{display:block;font-size:12px;color:var(--muted)}
.ws .ico{margin-left:auto;color:var(--faint)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-l{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:6px 10px 4px}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:var(--r);border:0;background:none;color:var(--muted);font-weight:500;text-align:left;font-size:13.5px}
.nav-i:hover{background:var(--hover);color:var(--fg)}
.nav-i.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm),inset 0 0 0 1px var(--line)}
.nav-i.on > .ico{color:var(--brand)}
.nav-i[disabled]{opacity:.45;cursor:default}
.nav-i .cnt{margin-left:auto;font-size:11px;font-weight:600;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--brand-soft);color:var(--brand-ink);display:inline-grid;place-items:center}
.nav-i .soon{margin-left:auto;font-size:10.5px;color:var(--faint)}
.nav-sub{padding-left:10px}
.sb-foot{margin-top:auto;position:relative}
.me{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border-radius:var(--r);border:0;background:none;text-align:left}
.me:hover,.me.open{background:var(--hover)}
.me b{display:block;font-size:13px;font-weight:600;line-height:1.25} .me small{display:block;font-size:12px;color:var(--muted)}
.me .ico{margin-left:auto;color:var(--faint)}
.av{width:30px;height:30px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.av.alt{background:var(--c-credit)}
.menu{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:6px;min-width:250px;z-index:40}
.menu.up{bottom:calc(100% + 6px);left:0;right:0}
.menu.down{top:calc(100% + 6px);right:0}
.menu-h{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu-l{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:8px 10px 4px}
.menu-i{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r-sm);border:0;background:none;text-align:left;font-size:13.5px;color:var(--fg)}
.menu-i:hover{background:var(--hover)}
.menu-i .ico{color:var(--muted)}
.menu-i .tick{margin-left:auto;color:var(--brand)}
.menu-sep{height:1px;background:var(--line);margin:4px 0}
.mainwrap{min-width:0;display:flex;flex-direction:column}
.tb{position:sticky;top:0;z-index:15;height:56px;display:flex;align-items:center;gap:12px;padding:0 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.crumbs{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);min-width:0;flex-wrap:nowrap;overflow:hidden;white-space:nowrap}
.crumbs .ico{color:var(--faint);width:14px;height:14px}
.crumbs .link{border:0;background:none;padding:2px 4px;border-radius:4px;color:var(--muted)}
.crumbs .link:hover{color:var(--fg);background:var(--hover)}
.crumbs b{color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.tb .grow{flex:1}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--faint);width:280px;font-size:13px}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;color:var(--fg)}
.kbd{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--faint)}
.ibtn{width:34px;height:34px;border-radius:var(--r);border:1px solid transparent;background:none;display:grid;place-items:center;color:var(--muted);position:relative;flex:none}
.ibtn:hover{background:var(--hover);color:var(--fg)}
.ibtn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--bg)}
.rolechip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:15px;border:1px dashed var(--brand-line);background:var(--brand-soft);color:var(--brand-ink);font-size:12px;font-weight:600;white-space:nowrap}
.mnav{display:none}
.main{padding:28px 32px 72px;max-width:1240px;width:100%;margin:0 auto}
.pop-wrap{position:relative}
.notif{width:340px}
.notif .n{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:10px;border-radius:var(--r-sm)}
.notif .n:hover{background:var(--hover)}
.n-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}

/* ===== Area identity ===== */
.at{width:28px;height:28px;border-radius:8px;display:inline-grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.at .ico{width:15px;height:15px}
.at.sm{width:22px;height:22px;border-radius:6px} .at.sm .ico{width:13px;height:13px}
.at.lg{width:40px;height:40px;border-radius:10px} .at.lg .ico{width:20px;height:20px}
.adot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.alabel{display:inline-flex;align-items:center;gap:8px;font-weight:500}

/* ===== Page structure ===== */
.stack{display:flex;flex-direction:column;gap:20px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head h1{font-size:24px;font-weight:600}
.ph{display:flex;align-items:flex-start;gap:14px}
.sub{color:var(--muted)}
.small{font-size:12.5px;color:var(--muted)}
.faint{color:var(--faint)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.meta-row{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.meta-row b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}

/* ===== Controls ===== */
.btn{height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;box-shadow:var(--shadow-sm);color:var(--fg)}
.btn:hover{background:var(--hover)}
.btn.primary,.btn.ink{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}
.btn.primary:hover,.btn.ink:hover{filter:brightness(1.06);background:var(--brand)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none;box-shadow:none;color:var(--brand-ink)}
.btn.ghost:hover{background:var(--brand-soft)}
.btn.danger{color:var(--bad);border-color:var(--bad-line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;line-height:1.6}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.p-acc{background:var(--brand-soft);color:var(--brand-ink)} .p-mut{background:var(--sunk);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--fg)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:9px;background:var(--sunk);flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow-sm)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 10px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;font-weight:500;margin-bottom:-1px}
.tabs button:hover{color:var(--fg)}
.tabs button.on{color:var(--fg);border-bottom-color:var(--brand)}
.tabs .n{font-size:11px;font-weight:600;background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:0 6px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.in{width:100%;height:38px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);min-width:0}
textarea.in{height:auto;min-height:76px;padding:10px 12px;resize:vertical}

/* ===== Surfaces ===== */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.sec{padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.sec .h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:8px;flex-wrap:wrap}
.sec h2{font-size:15px;font-weight:600}
.msg{padding:11px 14px;border-radius:var(--r);font-size:13px;display:flex;gap:10px;align-items:flex-start;border:1px solid transparent}
.msg .ico{margin-top:2px}
.msg.bad{background:var(--bad-soft);color:var(--bad-ink);border-color:var(--bad-line)} .msg.info{background:var(--brand-soft);color:var(--brand-ink);border-color:var(--brand-line)} .msg.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)} .msg.ok{background:var(--ok-soft);color:var(--ok)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{all:unset;cursor:pointer;padding:16px 20px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat:hover{background:var(--hover)}
.stat b{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.stat small{font-size:12.5px;color:var(--muted)}

/* tables */
.tablewrap{overflow-x:auto}
.th{padding:10px 20px;background:var(--sunk);border-bottom:1px solid var(--line);font-size:12px;font-weight:500;color:var(--muted);display:grid;gap:16px;align-items:center}
.tr{width:100%;text-align:left;padding:13px 20px;border:0;border-top:1px solid var(--line);background:var(--surface);display:grid;align-items:center;gap:16px;color:var(--fg)}
button.tr:hover{background:var(--hover)}
.th+.tr{border-top:0}
.g-clients{grid-template-columns:minmax(240px,1.6fr) 160px minmax(150px,1fr) 160px 110px 18px;min-width:900px}
.g-gd{grid-template-columns:minmax(0,1fr) 120px 90px 170px;min-width:620px}
.g-sc{grid-template-columns:minmax(0,1.4fr) 150px minmax(130px,1fr) 170px 90px;min-width:760px}
.chev{color:var(--faint)}
.bar{height:6px;border-radius:4px;background:var(--sunk);overflow:hidden;display:flex}
.bar span{height:100%}
.bar .v{background:var(--ok)} .bar .r{background:var(--brand)} .bar .x{background:var(--bad)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:10px 20px;background:var(--sunk);border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:12px 20px;border-top:1px solid var(--line);vertical-align:top}
table.t tr:first-child td{border-top:0}
table.t td.r,table.t th.r{text-align:right}

/* people */
.who-p{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;white-space:nowrap}
.who-p i{font-style:normal;width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;flex:none}
.who-p.p1 i{background:var(--brand);color:var(--on-brand)}
.who-p.p2 i{background:var(--surface);color:var(--brand-ink);box-shadow:inset 0 0 0 1.5px var(--brand)}
.who-p.o i{background:var(--sunk);color:var(--muted)}
.who-p.p1,.who-p.p2{color:var(--fg)}

/* lifecycle */
.life{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.life div{display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--faint);min-width:0}
.life div::before{content:"";height:4px;border-radius:3px;background:var(--line)}
.life .done{color:var(--muted)} .life .done::before{background:var(--brand)}
.life .cur{color:var(--fg);font-weight:600} .life .cur::before{background:linear-gradient(90deg,var(--brand) 55%,var(--line) 55%)}

/* attention rows */
.att{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 20px;border-top:1px solid var(--line)}
.att .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn)}
.att .ic.bad{background:var(--bad-soft);color:var(--bad)} .att .ic.acc{background:var(--brand-soft);color:var(--brand-ink)}

/* checklists */
.cl{display:grid;grid-template-columns:268px minmax(0,1fr);gap:20px;align-items:start}
.cl-nav{display:flex;flex-direction:column;gap:6px}
.cl-nav button{text-align:left;padding:12px 14px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-sm)}
.cl-nav button:hover{border-color:var(--line-strong)}
.cl-nav button.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.cl-nav .area{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted)}
.it{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:14px;align-items:start;padding:13px 20px;border-top:1px solid var(--line)}
.grp{padding:9px 20px;font-size:12px;font-weight:600;color:var(--muted);background:var(--sunk);border-top:1px solid var(--line)}
.grp:first-child{border-top:0;border-radius:var(--r-lg) var(--r-lg) 0 0}
.st{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.st .ico{width:12px;height:12px;stroke-width:2.6}
.st.verified{background:var(--ok);color:#fff}
.st.received{background:var(--brand-soft);box-shadow:inset 0 0 0 1.5px var(--brand)}
.st.rejected{background:var(--bad);color:#fff}
.st.missing{box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.st.requested{box-shadow:inset 0 0 0 1.5px var(--warn)}
.st.internal{background:var(--sunk)}
.it .nm{font-weight:500}
.it .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:12.5px;color:var(--muted)}
.it .acts{display:flex;gap:6px;align-items:center}
.flink{background:none;border:0;padding:0;color:var(--brand-ink);font-size:12.5px;text-decoration:underline;text-decoration-color:var(--brand-line);text-underline-offset:3px;text-align:left;overflow-wrap:anywhere}
.hint{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start;margin-top:6px}
.hint .ico{width:14px;height:14px;margin-top:2px;color:var(--brand)}
details.more summary{cursor:pointer;color:var(--muted);font-size:13px;padding:13px 20px;list-style:none}

/* ============ RULES ENGINE (template + fact find → checklist) ============ */
function scopeEnts(s, ctx){
  switch(s){
    case 'party': return ctx.parties; case 'primary': return [ctx.parties[0]]; case 'hh': return ['hh'];
    case 'payg': return ctx.payg||[]; case 'security': return ctx.securities||[]; case 'rental': return ctx.rentals||[];
    case 'rentalLoan': return ctx.rentalLoans||[]; case 'fund': return ctx.fund?[ctx.fund]:[]; case 'member': return ctx.members||[];
    case 'property': return ctx.properties||[]; case 'newparty': return ctx.newClient?ctx.parties:null;
    case 'io': return ctx.repayment==='IO'?ctx.parties:null; case 'selfemp': return ctx.selfemp||null; case 'ipParty': return ctx.ip||null; case 'lifeParty': return ctx.life||null; case 'existing': return ctx.existing||null; default: return null;
  }
}
function buildChecklist(cl, prodOverride){
  const prod = prodOverride || findProd(cl.prod).prod; const items=[], skipped=[];
  prod.docs.forEach(d=>{
    const m = META[d]||{s:'hh',by:'Customer'}, L = LIB[d]; const ents = scopeEnts(m.s, cl.ctx);
    if (!ents || !ents.length){ skipped.push({doc:d, n:L.n, why: SKIP_REASON[m.s] || 'Condition not met'}); return; }
    ents.forEach(e=>items.push({key:`${cl.id}|${d}|${e}`, cl:cl.id, doc:d, n:L.n, cat:L.cat, ent:e, by:m.by||'Customer', t:m.t||[], ver:L.ver, age:L.age}));
  });
  S.oneoffs.filter(o=>o.cl===cl.id).forEach(o=>items.push({...o, t:o.t||[], oneoff:true, age:'—'}));
  return {items, skipped};
}
const allCl = () => CHECKLISTS.concat(S.extraCl);
const clById = id => allCl().find(c=>c.id===id);
const filesFor = key => S.files.filter(f=>f.assign===key);
function itemStatus(it){
  const st = S.items[it.key], fs = filesFor(it.key);
  if (it.by!=='Customer' && !fs.length) return st?.status==='verified' ? 'verified' : 'internal';
  if (!fs.length) return S.requested[it.key] ? 'requested' : 'missing';
  return st?.status || 'received';
}
function clStats(cl){
  const {items} = buildChecklist(cl); const c={total:items.length,verified:0,received:0,rejected:0,missing:0,cust:0,custDone:0};
  items.forEach(it=>{ const s=itemStatus(it); if(s==='verified')c.verified++; else if(s==='received')c.received++; else if(s==='rejected')c.rejected++; else c.missing++;
    if(it.by==='Customer'){c.cust++; if(s==='verified'||s==='received')c.custDone++;} });
  c.pct = Math.round(c.verified/c.total*100); return c;
}
function siblings(it){
  if (!it.t?.some(t=>t==='passport'||t==='licence'||t==='title')) return [];
  const out=[]; allCl().forEach(cl=>{ if(cl.id===it.cl) return; buildChecklist(cl).items.forEach(o=>{ if(o.ent===it.ent && o.t?.some(t=>it.t.includes(t))) out.push(o); }); });
  return out;
}

      <p>Lower the home loan cost and use an offset; fund a $28k renovation; keep the Box Hill investment; bring SMSF compliance up to date; put income protection and own-occupation TPD in place that suit an anaesthetist’s procedural career; protect Oliver and Ruby with testamentary trust wills.</p>
      <p>CBA 6.54% vs ANZ 5.99% at 44% LVR — about $3,900 a year saved. Westpac interest-only period ends March 2027.</p></div>
      <span class="small">James Okafor · signed off 22 Sep 2026${customer?'':' · imported from Strategy_Pack_v2_signed.pdf'}</span></aside></div>`;
}

VIEWS.vault = () => {
  if (S.role==='admin') return vaultSettings();
  if (!S.drive) return `<div class="stack"><div class="head"><div class="stack" style="gap:6px"><h1>Vault</h1><span class="sub">Every customer document, read straight from your firm’s Google Drive.</span></div></div>
    <div class="panel sec" style="align-items:center;text-align:center;padding:56px 20px;gap:12px">${driveLogo()}<b style="font-size:18px">Connect Google Drive</b><span class="sub" style="max-width:46ch">Choose the root folder that holds one folder per customer. Othello reads and organises documents there — nothing is copied out of Drive.</span>${S.role==='admin'?'<button class="btn primary" data-act="connect">Connect Google Drive</button>':'<span class="small">Ask your client admin to connect Google Drive.</span>'}</div></div>`;
  const c=S.customers.find(x=>x.id===S.vc);
  return `<div class="stack">
    ${pageHead('Google Drive · Othello / Clients','Vault',`Every customer document, read from your firm’s Google Drive · synced ${S.rescanned?'just now':'4:58 pm'}`,`<button class="btn primary" data-act="scan">${I('refresh')}Scan now</button>`)}
    ${kpiRow([['folder','Folders linked',S.customers.filter(x=>x.match!=='none'&&(x.match==='exact'||x.confirmed)).length+' of '+S.customers.length,'Matched to customer records'],['file','Documents scanned',S.files.length+212,'Classified and stored'],['link','Need matching',unmatched().length,'Low confidence or unknown','vfilter','attn'],['alert','No folder found',noFolder().length,'Customers without a Drive folder']])}
    ${S.scanning?`<div class="panel sec" style="gap:10px"><b>Scanning ${esc(c.drive||'')}…</b><div class="scanbar"><span style="width:${S.scanPct}%"></span></div><span class="small">${S.scanPct<40?'Listing folders':S.scanPct<80?'Reading and classifying documents':'Matching to customer records and checklists'}</span></div>`:''}
    <div class="vault">
      <div class="panel"><div class="sec" style="padding:16px 18px 6px"><span class="eyebrow">Customers</span></div><div class="vlist">
        ${S.customers.map(x=>{const n=x.id==='kas'?unmatched().length:0;return `<button class="${x.id===S.vc?'on':''}" data-act="vc" data-v="${x.id}"><span class="fold ${x.match==='none'?'miss':''}"></span><span style="font-weight:500">${esc(x.name.split(' (')[0])}</span>
          <small class="${x.match==='none'?'bad':x.match==='fuzzy'&&!x.confirmed?'warn':''}">${x.match==='none'?'No folder found':x.match==='fuzzy'&&!x.confirmed?`Suggested folder · ${x.score}%`:n?`${n} to match`:esc(x.drive)}</small></button>`}).join('')}
      </div></div>
      <div class="stack" style="gap:16px;min-width:0">${vaultClient(c)}</div>
    </div></div>`;
};
function vaultClient(c){
  if (c.match==='none') return `<div class="panel sec" style="align-items:center;text-align:center;padding:48px 20px;gap:12px"><span class="fold miss" style="width:28px;height:22px"></span><b style="font-size:17px">No Google Drive folder found for ${esc(c.name)}</b><span class="sub" style="max-width:48ch">No folder under Othello / Clients matches the names in this customer’s fact find. Link an existing folder or create one from the standard structure.</span><div class="row"><button class="btn primary" data-act="folderMatch" data-v="${c.id}">Match manually</button><button class="btn" data-act="folderCreate" data-v="${c.id}">Create folder</button></div></div>`;
  if (c.match==='fuzzy' && !c.confirmed) return `<div class="msg warn">${I('alert')}<div style="flex:1"><b>Is “${esc(c.drive)}” this customer’s folder?</b> Matched on name similarity (${c.score}%).</div><button class="btn sm" data-act="folderMatch" data-v="${c.id}">Choose another</button><button class="btn sm primary" data-act="folderConfirm" data-v="${c.id}">Confirm</button></div>`+vaultOther(c);
  if (c.id!=='kas') return vaultOther(c);
  const um=unmatched().length;
  const crumb=`<div class="gd-crumb"><button data-act="vpath" data-v="">Othello</button><span class="s">›</span><button data-act="vpath" data-v="">Customers</button><span class="s">›</span>${S.vpath?`<button data-act="vpath" data-v="">${esc(c.drive)}</button><span class="s">›</span><b style="font-weight:500;padding:2px 6px">${S.vpath}</b>`:`<b style="font-weight:500;padding:2px 6px">${esc(c.drive)}</b>`}</div>`;
  const toolbar=`<div class="row"><span class="seg"><button class="${S.vmode==='folders'?'on':''}" data-act="vmode" data-v="folders">Folders</button><button class="${S.vmode==='scanned'?'on':''}" data-act="vmode" data-v="scanned">Scanned documents</button></span><span class="grow"></span><span class="small">Matched to <button class="flink" data-act="openCust" data-v="kas">Hart household</button> on fact find names</span></div>`;
  const alert = um?`<div class="msg info">${I('link')}<div style="flex:1"><b>${um} documents need matching.</b> They couldn’t be classified with confidence.</div><button class="btn sm" data-act="vfilter" data-v="attn">Show them</button></div>`:'';
  return `${toolbar}${alert}${S.vmode==='folders'?`<div class="panel" style="overflow:hidden"><div class="sec" style="gap:12px">${crumb}<div class="gd-chips"><span class="gem">✦ Ask Gemini</span><span>Type ▾</span><span>People ▾</span><span>Modified ▾</span><span>Source ▾</span></div></div>${dirTable()}</div>`:scannedTable()}`;
}
function vaultOther(c){ return `<div class="panel sec" style="gap:8px"><div class="gd-crumb" style="font-size:18px"><span class="faint">Othello › Clients ›</span> <b style="font-weight:500">${esc(c.drive)}</b></div><span class="small">${DRIVE_FOLDERS.length} folders · scanned and matched. Full document detail is shown for the Hart household in this prototype.</span></div>`; }
function dirTable(){
  const head=`<div class="th g-gd"><div>Name</div><div>Date modified ↓</div><div>File size</div><div>Othello</div></div>`;
  if (!S.vpath) return `<div class="tablewrap">${head}${DRIVE_FOLDERS.map(f=>{const n=S.files.filter(x=>x.folder===f).length,a=S.files.filter(x=>x.folder===f&&(x.unmatched||x.review)).length;
    return `<button class="tr g-gd" data-act="vpath" data-v="${f}"><span class="nm-cell"><span class="fold"></span><span>${f}</span></span><span class="small">18 Sept</span><span class="small">—</span><span class="small">${n} files${a?` · <b style="color:var(--warn)">${a} to match</b>`:''}</span></button>`}).join('')}</div>`;
  return `<div class="tablewrap">${head}${S.files.filter(x=>x.folder===S.vpath).map(f=>{const ext=f.name.split('.').pop().toLowerCase();
    return `<button class="tr g-gd" data-act="file" data-v="${f.id}"><span class="nm-cell"><span class="fic ${ext==='docx'?'doc':ext==='pdf'?'':'img'}">${ext==='pdf'?'PDF':ext==='docx'?'W':'IMG'}</span><span>${esc(f.name)}</span></span><span class="small">${f.mod}</span><span class="small">${f.size}</span><span>${f.unmatched||f.review?'<span class="pill p-warn">Needs matching</span>':f.assign?`<span class="pill p-ok">${areaName(clById(f.assign.split('|')[0]).area)}</span>`:f.record?'<span class="pill p-acc">Customer record</span>':'<span class="pill p-mut">On file</span>'}</span></button>`}).join('')}</div>`;
}
function scannedTable(){
  const fl=S.vfilter; const fs=S.files.filter(f=>fl==='all'||(fl==='attn'?(f.unmatched||f.review):fl==='matched'?!!f.assign:(!f.assign&&!f.unmatched&&!f.review)));
  return `<div class="row"><span class="seg">${[['all','All',S.files.length],['attn','Needs matching',unmatched().length],['matched','On a checklist',S.files.filter(f=>f.assign).length],['other','On file only',S.files.filter(f=>!f.assign&&!f.unmatched&&!f.review).length]].map(([k,l,n])=>`<button class="${fl===k?'on':''}" data-act="vfilter" data-v="${k}">${l} ${n}</button>`).join('')}</span></div>
  <div class="panel" style="overflow:hidden"><div class="tablewrap"><div class="th g-sc"><div>Document</div><div>Type</div><div>Belongs to</div><div>Checklist</div><div></div></div>
  ${fs.map(f=>{const k=f.assign?f.assign.split('|'):null; return `<div class="tr g-sc" ${f.isNew?'style="background:var(--ok-soft)"':''}><span style="min-width:0"><button class="flink" style="font-size:13.5px" data-act="file" data-v="${f.id}">${esc(f.name)}</button><div class="small">${f.folder}${f.isNew?' · new':''}</div></span>
    <span class="small">${f.unmatched?'Unclassified':TYPE_LABEL[f.type]}${!f.unmatched&&!f.manual?` · ${f.conf}%`:''}</span>
    <span>${f.ent?person(f.ent):'<span class="small">—</span>'}</span>
    <span class="small">${k?`${areaName(clById(k[0]).area)} · ${k[1]}`:f.record?'Customer record':f.unmatched||f.review?'—':'Not required'}</span>
    <span>${f.unmatched||f.review?`<button class="btn sm primary" data-act="manual" data-v="${f.id}">Match</button>`:''}</span></div>`}).join('')}
  </div></div>`;
}

      </div></div>`;

  return `<div class="stack">

  </div>`;
};

  <section class="stack" style="gap:12px"><div class="row"><h2 style="font-size:16px">Areas</h2><span class="grow"></span><span class="legend"><span><i style="background:var(--brand)"></i>Live</span><span><i style="background:var(--warn)"></i>Draft</span></span></div>

        <div class="acard-v"><b class="num">${libN}</b><span class="small">documents</span></div><div class="sbar"><span style="flex:1;background:var(--c-library)"></span></div>
        <div class="acard-l"><span><i style="background:var(--c-library)"></i>Requirements matrix <b class="num">${Object.values(LIB).filter(d=>d.prod!=='Firm-defined'&&d.prod!=='Personal insurance').length}</b></span><span><i style="background:var(--c-library)"></i>Medcentric-defined <b class="num">${Object.values(LIB).filter(d=>d.prod==='Firm-defined'||d.prod==='Personal insurance').length}</b></span></div></button>

    ${cats.map(c=>`<tr class="cg"><td colspan="${a.providers.length+2}">${esc(c)}</td></tr>${names.filter(n=>n.cat===c).map(n=>`<tr><td style="font-weight:500">${esc(n.name)}</td>${a.providers.map(p=>`<td class="pc">${cell(p,n.name)}</td>`).join('')}<td class="num small" style="text-align:right">${n.docs}</td></tr>`).join('')}`).join('')}
    </tbody></table></div></section>
  <section class="stack" style="gap:10px"><div class="row"><h2 style="font-size:15px">Providers</h2>${a.id==='insurance'?`<span class="small">From the MC Wealth approved product list · version ${APL.version}</span>`:''}</div><div class="prov-grid">${a.providers.map(p=>`<div class="prov"><span class="plogo">${pinit(p.name)}</span><div style="min-width:0;flex:1"><b style="display:block">${esc(p.name)}</b><span class="small">${esc(p.kind)} · ${p.products.length} products</span></div></div>`).join('')}
    </div>${a.id==='insurance'?`<span class="small">Also approved on the APL: ${APL.insurers.filter(n=>!a.providers.some(p=>p.name===n)).join(', ')}.</span>`:''}</section>
  ${a.id==='smsf'?`<section class="panel" style="overflow:hidden"><div class="sec" style="padding-bottom:10px"><div class="h" style="padding:0"><h2>Approved investments</h2><span class="small">MC Wealth APL · version ${APL.version} · SMSF holdings are checked against this list at annual compliance</span></div></div>
    <div class="tablewrap"><table class="t"><thead><tr><th>Category</th><th>Rule</th><th>Approved providers and products</th></tr></thead><tbody>${APL.cats.map(c=>`<tr><td style="font-weight:600;white-space:nowrap">${c[0]}</td><td class="small">${c[1]}</td><td style="font-size:13px">${c[2]}</td></tr>`).join('')}

function previewCtx(area,prod){
  if (area.id==='credit') return {id:'pv',ctx:{parties:['p1','p2'],payg:S.cfg.pv==='PAYG'?['p1','p2']:[],selfemp:S.cfg.pv==='SE'?['p1','p2']:null,securities:['a1'],repayment:prod.id.endsWith('-io')?'IO':'PI'}};
  if (area.id==='insurance') return {id:'pv',ctx:{parties:['p1','p2'],ip:prod.id.endsWith('-ip')?['p1','p2']:null,life:/-(life|tpd)$/.test(prod.id)?['p1','p2']:null,existing:['p1']}};
  const byArea=id=>CHECKLISTS.find(c=>c.area===id).ctx; return {id:'pv',ctx:byArea(area.id)};
}
function libFamily(area,prod){ return id => { const L=LIB[id]; if(L.prod==='All products') return true; if(area.id==='credit') return prod.cat==='Commercial'?L.prod.startsWith('Commercial'):(L.prod.startsWith('Residential')||['IO-001','FIX-001'].includes(id)); if(area.id==='tax') return L.prod==='Tax return'; if(area.id==='smsf') return L.prod.startsWith('Self'); if(area.id==='insurance') return L.prod==='Personal insurance'; return L.prod.startsWith('Will')||['POA-001','ASP-001','ASP-002','CPL-ENT-001'].includes(id); }; }
function cfgProduct(){
  const {area,prov,prod}=findProd(S.cfg.prod);
  const lib = Object.keys(LIB).filter(libFamily(area,prod));
  const typeOf = c => c.startsWith('Income - ') ? 'Income' : c;
  const types={}; lib.forEach(id=>{const t=typeOf(LIB[id].cat);(types[t]=types[t]||[]).push(id);});
  const tnames=Object.keys(types); if(!S.cfg.open) S.cfg.open=[tnames[0]];
  const reqN = ids => ids.filter(id=>prod.docs.includes(id)).length;
  const docRow = id => {const on=prod.docs.includes(id),L=LIB[id];return `<div class="docrow"><span style="min-width:0"><span style="font-weight:500">${esc(L.n)}</span><div class="r">${id} · ${esc(L.applies)}${L.rule!=='always'?' · <span class="tag">Conditional</span>':''}</div></span><button class="tog ${on?'on':''}" aria-pressed="${on}" data-act="cfgDoc" data-v="${id}">${on?'Required':'+ Require'}</button></div>`;};
  const body = t => { if (t!=='Income') return types[t].map(docRow).join('');

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if (S.menu && !e.target.closest('[data-stop]') && !(t&&t.dataset.act==='menu')) { S.menu=''; if(!t){ render(); return; } }
  if(!t) return;
  if (t.dataset.act==='close-bg'){ if(e.target!==t) return; S.drawer=S.modal=null; S.wide=false; render(); return; }
  const fn=A[t.dataset.act]; if(!fn) return; e.preventDefault();
  const r=fn(t.dataset.v,t); if(r!==true && r!==undefined) return; if(r===true) return; render();
});
document.addEventListener('submit',e=>{
  if (e.target.id!=='login') return; e.preventDefault();
  const role=$('#lg-role').value, pw=$('#lg-pw').value;
  if (pw==='Jupiter'){ try{sessionStorage.setItem('ov_auth',role);}catch(e){} S.authed=true; S.loginErr=''; S.role=role; S.view=role==='admin'?'config':role==='adviser'?'dash':'clients'; S.cfg.screen='home'; window.scrollTo(0,0); render(); }
  else { S.loginRole=role; S.loginErr=pw?'That password isn’t right. Try again.':'Enter the password.'; render(); }
});
document.addEventListener('change',e=>{
  if (e.target.dataset && e.target.dataset.loginRole!==undefined){ S.loginRole=e.target.value; const d=$('#lg-desc'); if(d) d.textContent=VIEWS_LOGIN.find(v=>v[0]===e.target.value)[2]; return; }
  const k=e.target.dataset?.up; if(!k||!e.target.files.length) return;
  const file=e.target.files[0], [cl,doc,en]=k.split('|'), area=clById(cl).area;
  S.files.unshift({id:'u'+Date.now(),folder:area==='tax'?'A&T':areaName(area),name:file.name,size:Math.max(1,Math.round(file.size/1024))+' KB',mod:'Today',type:(META[doc]?.t||['unknown'])[0],ent:en,conf:100,assign:k,isNew:true,x:{'Uploaded':'Customer portal','Saved to':'Vault (Google Drive)'}});
  S.items[k]={status:'received'}; delete S.requested[k]; toast('Uploaded — your adviser will check it');
});
